<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#52615d"/><stop offset="1" stop-color="#233b3d"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#69705c"/><stop offset="1" stop-color="#1c3335"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#a6b4a0" stop-opacity=".62"/><stop offset="1" stop-color="#304b51" stop-opacity=".55"/></linearGradient>
 <pattern id="tile" width="84" height="50" patternUnits="userSpaceOnUse"><path d="M0 2H84M0 26H84" stroke="#d0bc91" stroke-opacity=".15" stroke-width="2"/><path d="M42 0V50" stroke="#0d2028" stroke-opacity=".18"/></pattern>
 <pattern id="wallpaper" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M24 7Q31 15 24 23Q17 15 24 7ZM24 23V38" fill="none" stroke="#d7c6a0" stroke-opacity=".09" stroke-width="2"/></pattern>
 <radialGradient id="lamp"><stop stop-color="#e8cc91" stop-opacity=".25"/><stop offset="1" stop-color="#e8cc91" stop-opacity="0"/></radialGradient>
</defs>
<rect width="960" height="540" fill="#14272d"/>
